    - name: "Nutrition"
      score: "B"
      recorded: "Requires assistance with eating and drinking, normal fluids and pureed diet level 4, reported to take 30 minutes to assist. Prescribed ensure drinks. Below average BMI. Nutrition score 16 — high risk."
      score-based-on-description: "B"
      challenge: ""
