  impossible: "partial"
  outcome: "Threshold not met"
  totals: {a-star: 0, a: 0, b: 4, c: 7}
  domains:
    - name: "Breathing"
      score: "C"
      recorded: "No breathing issues."
      score-based-on-description: "C"
      challenge: ""
    - name: "Nutrition"
      score: "C"
      recorded: "Bridget is unable to feed herself as she gets distracted and loses interest in eating. Staff begin by observing how Bridget is eating. If she is not eating they will intervene. If in a bad mood she will push staff hands away and push or throw food. Staff sit and attempt to feed Bridget. This process can take 30 mins. Bridget will play with her food and it will often fall on the floor. Weight stable. Has Ensure Compact."
      score-based-on-description: "B"
      challenge: "Description precisely matches the B descriptor word for word: 'needs feeding to ensure adequate intake and takes a long time (half an hour or more)'. Own description meets B threshold. Scored C. Direct internal inconsistency."
    - name: "Continence"
      score: "B"
      recorded: "Bridget is doubly incontinent. As Bridget has a prolapsed womb, she incurred an infection on her prolapse Oct 2023 and was prescribed Cefaloxin. Bridget is resistant to personal care due to pain from prolapsed womb. Awaiting hospital advice."
      score-based-on-description: "B"
      challenge: ""
    - name: "Skin Integrity"
      score: "C"
      recorded: "Bridget's skin is in good condition. No airflow mattress required."
      score-based-on-description: "B"
      challenge: "Cancer diagnosis occurred during the 163-day gap between assignment and completion. Prolapsed womb with infection. No skin risk assessment cited despite deteriorating health. Should be at least B."
    - name: "Mobility"
      score: "B"
      recorded: "Bridget's mobility is poor. She is in pain due to prolapsed uterus and will slip out of her chair. When walking palm-to-palm she leans backwards due to pain and is at risk of falling. Suffered a fall June 2023 resulting in fractured hip. Unable to use mobility aids — no capacity to understand them. Does not walk independently now. Bed rails used."
      score-based-on-description: "B"
      challenge: ""
    - name: "Communication"
      score: "C"
      recorded: "Bridget cannot communicate her needs and make her choices of daily living known. She is unable to make decisions concerning choice of food. Staff have attempted to show her photos of choices but Bridget will tear the photos up."
      score-based-on-description: "B"
      challenge: "Description says 'cannot communicate needs' and tears up communication aids — stronger than C. Should be B minimum. Unexplained downgrade from B in all three previous checklists."
    - name: "Psychological/Emotional"
      score: "C"
      recorded: "Bridget has mood disturbances and anxiety symptoms but staff are able to distract her with finger puppets, use of water in a bowl and singing."
      score-based-on-description: "C"
      challenge: ""
    - name: "Cognition"
      score: "B"
      recorded: "Bridget has cognitive impairment. She is disorientated as to time and place. Not aware of consequences of not eating or drinking. Will take pain patch off as she does not understand why she is wearing it. Not aware of any basic tasks and unable to make choices. Will push table forward — risk of harm to others. Without 24-hour care, would be at risk of ill health."
      score-based-on-description: "A"
      challenge: "Description matches A descriptor: 'unable to make choices even with supervision', 'high risk of harm, neglect or health deterioration', 'without 24-hour care would be at risk'. Downgraded from A (in Checklists #1-3) to B without explanation."
    - name: "Behaviour"
      score: "B"
      recorded: "Bridget exhibits challenging behaviour at times."
      score-based-on-description: "A"
      challenge: "All care homes have consistently documented challenging, high-dependency behaviours throughout. Description of 'challenging behaviour at times' is vague — far less detail than previous checklists. High (A) is the appropriate score given the consistent care home record. Scored B."
    - name: "Drug Therapies"
      score: "C"
      recorded: "Bridget has liquid/crushed and covert medication administered to her. If she does not like the taste she will spit it out. Has Memantine (Alzheimer's), Ad-cal (bones), Hydrocortisone Promethazine (anti-psychotic) and pain patches for prolapsed womb."
      score-based-on-description: "B"
      challenge: "Covert medication administration, anti-psychotic (Promethazine), non-compliance (spitting out medication) — these describe a regime requiring skilled administration and monitoring. Should be B. Scored C."
    - name: "Altered States"
      score: "C"
      recorded: "No ASC"
      score-based-on-description: "C"
      challenge: ""
  notes: "Assigned 11 Dec 2023 — completed 22 May 2024 — a gap of 163 days. Cancer of cells of cervix diagnosed 21 Dec 2023 (10 days after assignment) but not reflected in any domain. Cognition downgraded from A to B with no explanation despite description matching A. Nutrition scored C despite description matching B. Communication scored C despite being scored B in three previous checklists."

