    - name: "Skin Integrity"
      score: "C"
      recorded: "Mobile and no skin integrity issues"
      score-based-on-description: "B"
      challenge: "Recorded description is factually wrong. Prolapsed womb was documented from at least June 2021 (prolapse visible, ulceration noted at ring pessary removal March 2021; EPUT Continence review Jun 2021: 'prolapse down out of vagina'). A uterovaginal prolapse carries an ongoing risk of skin breakdown, ulceration, and infection — directly relevant to the Skin Integrity domain. No Waterlow score cited; no skin risk assessment referenced. Should be B."
    - name: "Mobility"
      score: "C"
      recorded: "Walks around all day. Does not sit down unless for mealtimes."
      score-based-on-description: "C"
      challenge: "Recorded as walking all day — but absconding incident (6 Sep 2020) just 7 weeks earlier not reflected. No wandering risk assessment cited."
    - name: "Communication"
      score: "B"
      recorded: "Unable to communicate well. Will speak but words will be expressed in jumbled manner."
      score-based-on-description: "B"
      challenge: ""
    - name: "Psychological/Emotional"
      score: "C"
      recorded: "No psychological needs. Will occasionally become upset when her needs are not understood."
      score-based-on-description: "C"
      challenge: ""
    - name: "Cognition"
      score: "A"
      recorded: "Prompting and supervision required with all aspects of daily living. No awareness of care needs."
      score-based-on-description: "A"
      challenge: "Correctly scored."
    - name: "Behaviour"
      score: "C"
      recorded: "No evidence of challenging behaviour"
      score-based-on-description: "A"
      challenge: "All care homes consistently documented challenging behaviour throughout. Care homes reported absconding, faecal smearing, transferring faeces to other residents' beds, removing belongings, touching food. 'No evidence of challenging behaviour' is directly contradicted by contemporaneous care home records. Score should be A (High)."
    - name: "Drug Therapies"
      score: "C"
      recorded: "No medication is taken at present."
      score-based-on-description: "B"
      challenge: "Description is factually incorrect. GP SAR records confirm Bridget was on Donepezil 10mg (cholinesterase inhibitor for Alzheimer's) and Promethazine at Westcliff Lodge at this date. These were documented on transfer to Palmerston House in April 2023. A dementia medication requiring monitoring and an antipsychotic constitute a managed regime — should be B at minimum."
    - name: "Altered States"
      score: "C"
      recorded: ""
      score-based-on-description: "C"
      challenge: ""
  notes: "Completed in 13 minutes. Address records Palmerston House — Bridget was at Westcliff Lodge. Age 75 is wrong by 4 years. Westcliff Lodge manager's letter 15 Nov 2022 (same month) documents high-dependency behaviours contradicting the C score for Behaviour."

