      score: "A"
      recorded: "Falls risk score of 7 — high risk. Unable to assist or cooperate with transfers and repositioning. Hoist used with assistance of 2, mostly remains in bed. Due to leaning to the left a specialist chair is used when sitting out. Rigid arms and legs unable to move independently."
      score-based-on-description: "A"
      challenge: ""
    - name: "Communication"
      score: "B"
      recorded: "Unable to verbalise, will say the odd word but rarely. Staff must anticipate all needs, they have come to understand verbal noises and what they indicate, such as grinding of teeth to indicate stress/anxiety, humming and laughing when happy."
      score-based-on-description: "A"
      challenge: "Description: 'unable to verbalise, will say the odd word but rarely. Staff must anticipate all needs.' This is the High descriptor — 'unable to reliably communicate at any time and in any way, even when all practicable steps taken.' Scored B."
    - name: "Psychological/Emotional"
      score: "C"
      recorded: "No reported mood disturbances"
      score-based-on-description: "C"
      challenge: ""
    - name: "Cognition"
      score: "B"
      recorded: "Living with Alzheimer's dementia, causing significant cognitive deficit."
      score-based-on-description: "A"
      challenge: "Description 'significant cognitive deficit' is minimal — lacks the detail of Checklists #1-3 which justified A. A remains appropriate given consistent history but description should be more detailed."
    - name: "Behaviour"
      score: "C"
      recorded: "Some non compliance at times with care needs, no challenging behaviour that frequently poses a risk to self, others and property."
      score-based-on-description: "A"
      challenge: "All care homes have consistently documented challenging behaviour throughout. 'Some non-compliance at times' understates the consistent care home record. High (A) should apply."
    - name: "Drug Therapies"
      score: "C"
      recorded: "Able to take orally, if non compliant staff are able to give covertly."
      score-based-on-description: "B"
      challenge: "Even the recorded description — covert administration when non-compliant — warrants B. The full regime at this date includes: Memantine (covert), Promethazine (crushed/covert), Buprenorphine 15mcg/hour (Schedule 3 opioid, palliative-prescribed, monthly oversight), Adcal-D3, Medroxyprogesterone, Lactulose and Senna PRN, Ensure Compact BD. Two medications under active MCA Best Interest process. ACB score 3 (moderate-to-high anticholinergic burden). The description is a material understatement. Should be B at minimum."
    - name: "Altered States"
      score: "C"
      recorded: "No reported ASC"
      score-based-on-description: "C"
      challenge: ""
  notes: "First positive checklist in five years. Triggered ICB referral. Same assessor (Lynne Gardiner) who completed the Jul 2025 Care & Support Plan Review showing correct age 74 — confirms age on this checklist should also be 74. To be verified against source document."

