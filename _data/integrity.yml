    - name: "Skin Integrity"
      score: "B"
      recorded: "Waterlow score of 27 very high risk. Braden score of 12 — high risk of developing pressure ulcers. Skin currently intact, unable to move self in bed, on an air mattress. Remains in bed for most of the time. Doubly incontinent. Fragility score of 7 — severely frail."
      score-based-on-description: "A"
      challenge: "Waterlow 27 is in the extreme risk band. Skin integrity is maintained only because of intensive preventative intervention (air mattress, repositioning, incontinence management). The A descriptor — 'skin problems requiring frequent and skilled assessment and treatment beyond the norm' — is more appropriate when a patient is bedbound, doubly incontinent, with a Waterlow at the extreme end of the scale. Scored B."
