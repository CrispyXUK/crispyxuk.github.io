      challenge: "Description records touching other residents' food as a consistent pattern. Previous checklists record faecal smearing, escape, and transferring faeces to other beds. All care homes have consistently documented challenging behaviour. High (A) descriptor applies — 'challenging behaviour of type/frequency that poses a predictable risk.' Scored B."
