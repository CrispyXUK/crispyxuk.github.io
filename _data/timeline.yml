  event: "SLT swallowing assessment (face-to-face dysphagia, 45 min): trialled yoghurt and sips of squash. Safe diet levels confirmed: IDDSI Level 0 (thin drinks); Level 4 (pureed food); Level 6 (soft/bite-sized with assistance). Swallowing difficulties had been documented since mid-2023 — formal SLT assessment delayed by over 12 months. Discharged from SLT service."

- date: "16 Jul 2024"
  event: "Comprehensive Medication Review (PCN pharmacist, care home manager Shelley, 25 min). Key findings: Memantine dose corrected to nighttime (care home unaware of timing); Promethazine nighttime 20mg stopped (bedbound, excessively drowsy); paracetamol reduced to 1g TDS (weight 44.9 kg — below 50 kg threshold); Ensure Compact supply shortfall identified. MCA for covert medication found not signed — home visit booked."
