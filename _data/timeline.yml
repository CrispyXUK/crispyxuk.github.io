  key: true
  event: "Skin tear laceration left forearm — wound care referral to District Nursing; EPUT IAS full assessment (Waterlow 10; weight 46.0 kg). SSKIN bundle initiated; wound swab to lab; Inadine and KerraFoam dressings applied. Confirms nursing-level wound care required at Admiral Court throughout 2021."

- date: "9 Mar 2021"
  event: "Ring pessary removed from vagina; patient treated with Estriol cream; ulceration documented. Patient unable to engage with treatment. No MCA Best Interests process documented for intimate gynaecological treatment."

- date: "15 Mar 2021"
  event: "GP review: aggressive behaviour (picks up implements to threaten staff, 'get off my face, leave me alone'); double incontinent; no prolapse seen on examination. Promethazine discussed with family but declined. No pessary has been given by carers since admission in September 2020."

- date: "6 Apr 2021"
  event: "EPUT Dementia Intense Support review at Admiral Court: patient more settled; independently mobilising; requires full assistance of 2 staff for personal and continence care; word-finding difficulties; managing level 7 diet."

- date: "26–28 Apr 2021"
  event: "Advance care plan completed and signed. Preferred place of death: care home. DNACPR in place. Admission avoidance care plan agreed. Family (daughter, holds POA) in agreement. Second COVID-19 vaccine dose (AstraZeneca) administered 28 Apr."
  key: true

- date: "29 Jun – 1 Jul 2021"
  event: "EPUT Continence Service annual review: Waterlow 14; prolapse down out of vagina; doubly incontinent; waist 102 cm. Pull-ups prescribed. Patient 'not on any pressure equipment' despite Waterlow 14 — no pressure prevention strategy documented."
  key: true

