# Chronological timeline. Each entry: date, event, key (true = highlight)
- date: "2020"
  type: placement
  placement-name: "Sweyne Court"
- date: "Apr 2020"
  event: "Kira Walker emails Council Dementia Community Support Team describing Bridget's wandering. Council sends activity pack only — no assessment, no safeguarding referral, no CHC consideration."
- date: "27 Jul 2020"
  event: "Mark Walker submits Supported Self-Assessment (Service Request 6614531). Savings declared above £23,250."
- date: "28 Jul 2020"
  event: "DIST comprehensive assessment: word-finding difficulty, memory decline, medication refusal (12+ months), wandering, faecal placement outside, aggressive moods. DIST calls Kira (daughter, 28 min) confirming Bridget has not taken medication for over a year; family to place her in Sweyne Court respite with a view to permanent residence."
- date: "2 Sep 2020"
  event: "Bridget admitted to Sweyne Court (respite). No Council notification; no needs assessment initiated. Placement entirely self-funded — no Council care plan, eligibility determination, or contribution assessment produced."
- date: "5 Sep 2020"
  event: "Day 3 at Sweyne Court: cellulitis (left leg — swollen, red, hot from knee down); paramedic called; OOH doctor consulted; Flucloxacillin 500mg QID and paracetamol prescribed. Simultaneously: acute behavioural crisis — restlessness, agitation, refusal of personal care; found on top of bedridden resident; attempting to escape through window. Urine sample obtained (later rejected 11 Sep for insufficient labelling)."
  key: true
- date: "6 Sep 2020"
  event: "Bridget absconds from Sweyne Court, reaches Rayleigh High Street barefoot. CQC and safeguarding lead Jo Allen notified. 24-hour 1:1 care imposed; family told to fund it (£4,460.65). Jo Allen: Council not obliged as Bridget is private."
- date: "9 Sep 2020"
  event: "CMHT crisis briefing to DIST (30 min): Bridget has absconded twice; absconding risk assessed as high. CPN recommends Promethazine 25mg BD — no capacity assessment or family consultation documented; no MCA Best Interests record. Placed on 1:1 observation. ABC chart recommended to record behavioural incidents."
  key: true
- date: "10 Sep 2020"
  event: "DIST calls Sweyne Court (Deputy Manager Maxine): Bridget slept well; ABC chart to be completed; Admiral Court to assess Bridget the following day. ABC chart subsequently absent from all records — behavioural pattern data lost."
- date: "11 Sep 2020"
  event: "Urine MC&S sample rejected — insufficient identifiers; no re-collection attempt documented. Lost opportunity for UTI screening during acute behavioural crisis."
- date: "15 Sep 2020"
  event: "Permanent transfer to Admiral Court (registered nursing home). DIST to discharge. No Council notification; no needs assessment initiated; no FNC assessment initiated; no DoLS application documented at admission. This is the Care Act s.13 triggering event — Council did not respond."
  key: true
- date: "11–16 Sep 2020"
  event: "Hallmark (Admiral Court — registered nursing home) admits Bridget c.16 Sep 2020 at £1,450/week. Placement begins as respite; becomes permanent due to Covid-19. Transfer care plan records her 'at low risk of leaving the home unnoticed' — 10 days after the absconding incident."
- date: "16 Sep 2020"
  type: placement
  placement-name: "Admiral Court"
- date: "22 Sep 2020"
  event: "DIST discharges Bridget without formal MDT handover; no written care plan transferred to Admiral Court; contact details given verbally only. Continuity of care broken."
- date: "14 Oct 2020"
  event: "GP contacts Admiral Court (Irene, senior staff): unable to establish who prescribed Promethazine or whether dose was 10mg or 25mg; no transfer documentation found. DIST confirms no one knows who actioned the dose change from 10mg to 25mg. GP declines to prescribe without reviewing patient or receiving clinical history. Prescribing authority never established; medication history remains incomplete."
  key: true
- date: "27 Oct 2020"
  event: "EPUT Integrated Adult Services: Waterlow score 11.0 (BMI 19.99; weight 46.2 kg); MUST nutritional assessment stable; skin and heel assessment (cracked heels noted, moisturising cream advised). District Nursing referral accepted then immediately marked 'Discharged From Care' — no clinical reason for discharge documented."
- date: "10 Nov 2020"
  event: "DoLS Standard Authorisation granted at Admiral Court. Lack of capacity confirmed; continuous supervision; not free to leave. Kira Walker appointed RPR."
- date: "10 Nov 2020"
  event: "GP reviews Promethazine with Admiral Court (Irene): home not reporting behaviours of concern; Promethazine changed to PRN; not required for past 2 weeks. Plan: review in 3 months; stop if not being given."
- date: "4 Dec 2020"
  event: "Waterlow score 14.0 — up from 11.0 in 5 weeks (+27%); no intervention documented and no care plan update. Continence assessment: doubly incontinent; faecal smearing; wet bedding nightly; removing pads; Type 3–4 stools. Rapid deterioration; no Council involvement throughout."
  key: true
- date: "11 Dec 2020"
  event: "GP home visit: patient uncooperative; cracked and broken skin on plantar and heel documented (images provided by care home); Fusidic acid cream prescribed. Wound first identified at 27 Oct assessment but not treated until now."
- date: "29 Dec 2020"
  event: "COVID-19 test result positive (Pall Mall Surgery)."
  key: true
- date: "30 Dec 2020"
  event: "GP video consultation (COVID-19): poor appetite; no fever spikes; increased lethargy; alert and responsive; DNAR/PPC/PPD in place. SMS to carer: feet improving with soaking and cream — awaiting images. Medication review: no medications to hold during COVID. Lethargy increase documented but not investigated."
- date: "31 Dec 2020"
  event: "GP calls daughter: family aware Bridget is COVID positive; reassurance given; family confirm would not wish for hospital admission; advanced care plan and DNAR discussed; family satisfied with plans."
- date: "2020–2022"
  event: "Bridget self-funded at Admiral Court (nursing home) at £1,450/week — no Council involvement, no subsidy, no FNC, no CHC referral. Capital depleted from above £23,250 to below £14,250 entirely through privately-paid fees. Overdue balance reaches £12,842.86; final account 5 Oct 2022."
- date: "27–28 Sep 2022"
  event: "Transfer to Westcliff Lodge (residential care home). Westcliff Lodge resident contract signed 28 Sep 2022. Council formally involved under Care Act 2014. 12-week property disregard begins."
