- date: "3 Oct 2024"
  event: "Laxido review: commenced February 2024 by palliative care (Lactulose insufficient for Buprenorphine-related constipation). Near-daily use confirmed by care home manager. Formalised as regular maintenance prescription (1 sachet once or twice daily)."

