# ── 2024 ─────────────────────────────────────────────────────────────────────

- type: year-header
  label: "2024"
  anchor: "year-2024"
  description: "Rapid transition to bedbound; palliative care referral; MCA belatedly completed; Waterlow reaches 24; CHC Checklist omits cancer; cancer on palliative pathway"

- date: "5 Jan 2024"
  event: "Ward round: BP 108/77; Temp 36.1°C; RR 18; O2 97%; HR 72. Buprenorphine patch increased from 5mcg to 10mcg. Liquid paracetamol QDS prescribed. Patient on palliative pathway."

- date: "19–30 Jan 2024"
  id: jan-crisis-2024
  event: "Constipation crisis: 5-day bowel retention; three Microlax micro-enemas ineffective; phosphate enema prescribed. PR examination: hard stool in higher rectum. Simultaneously: Deep Tissue Injury (DTI) to left buttock identified — tissue viability referral; dynamic mattress and dynamic cushion ordered; repositioning every 2 hours; SEPSIS monitoring plan. Waterlow 17."
  key: true

- date: "5 Feb 2024"
  event: "Acute blood results — abnormal: CRP 26.0 mg/L (high); Na 148 mmol/L (high); ALT 59 iu/L (high); WBC 9.1; PLT 207; monocytes 0.85 (elevated). Flagged as 'unwell.' GP plan: Nitrofurantoin started (UTI); increase fluids; if not improving, consider palliative referral."
  key: true

- date: "23 Feb 2024"
  id: palliative-referral
  event: "RAPID CLINICAL DECLINE: ward round documents Bridget now fully bedbound — previously could sit in chair and self-feed; now requires complete assistance and cannot sit safely (falls forward). Rapid deterioration over 5–6 weeks post-chemotherapy course. BP 140/69; HR 93; O2 95%. Palliative care referral made to EPUT SEE Palliative Care Services. No CHC reassessment triggered despite material change in condition."
  key: true

- date: "25–27 Feb 2024"
  event: "Palliative Care nursing intake: height 1.52m; weight 47.1 kg; BMI 20.4. Diagnosis: frailty, Alzheimer's, cancer of cervix, uterovaginal prolapse, right hip repair. Buprenorphine increased to 15mcg patch (trialled 10mcg for 6 weeks). Full palliative care plans initiated: pain, breathlessness, bowel, pressure areas, oral hygiene, nutrition, psychological support."

- date: "30 Apr 2024"
  event: "EPUT DIST Final Dementia Review: patient nursed in bed; staff anticipate all needs; advanced dementia. Plan: no planned changes. Discharged from DIST caseload — DIST no longer involved after this date."

- date: "22 May 2024"
  id: checklist-4
  evidence-refs: [chc-checklists]
  event: "CHC Checklist #4 completed. Threshold not met. Cancer diagnosis (Dec 2023) and hospital attendances not referenced despite 5-month gap between assignment and completion. Palliative care involvement (since Feb 2024) not reflected. Incorrect age/address. Family never notified."
  key: true

- date: "29 May 2024"
  event: "DoLS/LPS authorisations granted across 9 domains at Palmerston House. Last known authorisation — expires 29 May 2025."

- date: "5 Jun 2024"
  event: "Palliative Care: Waterlow, aSSKIN and MUST assessments initiated; referrals for pressure-relieving equipment; equipment functionality checked; District Nurse leaflet left."

