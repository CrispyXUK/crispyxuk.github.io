  key: true

- date: "15 Aug 2024"
  event: "Palliative care assessment: weight 44.9 kg; BMI 19.4. Waterlow score 24 (up from 19 in June — a 26% increase in 8 months). Bedbound; cancer on palliative pathway. MUST assessments completed; Airflow mattress referenced."
  key: true

- date: "Aug 2024"
