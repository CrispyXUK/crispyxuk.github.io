- name: "Essex Partnership University NHS Foundation Trust (EPUT)"
  detail: "Provider of community health and mental health services across South East Essex, commissioned by NHS Essex ICB. Operates under a joint partnership with Southend-on-Sea City Council and Essex County Council within the Mid and South Essex Integrated Care System. Services involved in Bridget's care: DIST (Dementia Intensive Support Team, 2020–2024 — annual dementia reviews at Admiral Court, Westcliff Lodge, and Palmerston House); Adult Bladder & Bowel Specialist Service (2020–2025 — serial Waterlow assessments, continence management); Integrated Adult Services / District Nursing (wound care, Waterlow, 2020–2024); Urgent Community Response Team (May 2023 fall); Tissue Viability (Jan 2024 — DTI management, DATIX E259548); Palliative Care (Feb 2024–ongoing). Under National Framework para 6.4, any EPUT clinician identifying potential CHC eligibility has an independent duty to refer. No EPUT service ever made a CHC referral despite continuous clinical contact. In February 2026, EPUT and NHS confirmed to Mark Walker that they hold no records relating to Bridget prior to 2025 — directly contradicted by years of EPUT entries in the GP SAR. EPUT Bladder & Bowel attended Bridget on 13 August 2025, 16 days before the MDT; Palliative Care was active throughout."
