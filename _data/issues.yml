  issue: "The Council's IPC (11 Apr 2023) names the service provider as 'Palmerston House, 23-25 Palmerston Road, SS0 7TA'. However, CQC registration 1-156343233 is at 21 Palmerston Road, recorded as 'Interchurch Care Centre'. Land Registry confirms these are separately-owned freehold titles: 23-25 Palmerston Road is owned by Higgins Property Investments Limited (since 2011); 21 Palmerston Road is owned by Aysen Tekin and Erbil Gulhan (from Sept 2023, with a Lloyds Bank charge). The IPC therefore names the address of a different legal entity from the CQC-registered provider. No explanation for this discrepancy has been provided. If the contract is with the owner of 23-25, it may not bind the registered care home operator at No. 21 — raising questions about contractual accountability and whether the correct regulated entity was party to the placement agreement."
