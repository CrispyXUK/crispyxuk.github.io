theme: jekyll-theme-chirpy
theme_mode: light

lang: en
timezone: Europe/London

title: "Bridget Walker — Evidential Record"
tagline: "LGSCO Ref 25 019 572 / Council Ref 30000912"
description: "Private case record for LGSCO investigation ref 25 019 572 into Southend-on-Sea City Council Adult Social Care"
url: "https://crispyxuk.github.io"
baseurl: ""

github:
  username: crispyxuk

social:
  name: Mark Walker
  email: ""
  links: []

avatar: ""
toc: false

comments:
  provider: ""

paginate: 10

analytics:
  google:
    id: ""

pwa:
  enabled: false

# Case-specific data
case_ref_lgsco:    "25 019 572"
case_ref_council:  "30000912"
case_ref_icb:      "BC70014"
investigator:      "Paul Gyan-Apenteng"
version:           "5"
last_updated:      "June 2026"

# Jekyll build
markdown:    kramdown
highlighter: rouge
permalink:   pretty

plugins:
  - jekyll-include-cache

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gem"
  - claude.md

include:
  - pages

collections:
  tabs:
    output: false
    sort_by: order

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      permalink: /emails/:title/
      comments: false
  - scope:
      path: "pages"
    values:
      comments: false

