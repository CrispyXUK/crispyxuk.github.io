theme: jekyll-theme-chirpy
theme_mode: light

lang: en
timezone: Europe/London

title: "Bridget Walker — Evidential Record"
tagline: "LGSCO Ref 25 019 572 / Council Ref 30000912"
description: "Private case record for LGSCO investigation ref 25 019 572 into Southend-on-Sea City Council Adult Social Care"
url: "https://crispyxuk.github.io"
baseurl: ""

github:
  username: crispyxuk

social:
  name: Mark Walker
  email: ""
  links: []

avatar: ""
toc: false

comments:
  provider: ""


analytics:
  google:
    id: ""

pwa:
  enabled: false

# Case-specific data
case_ref_lgsco:    "25 019 572"
case_ref_council:  "30000912"
case_ref_icb:      "BC70014"
investigator:      "Paul Gyan-Apenteng"
version:           "5"
last_updated:      "June 2026"

# Jekyll build
markdown:    kramdown
highlighter: rouge
permalink:   pretty

plugins:
  - jekyll-include-cache

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gem"
  - claude.md

include:
  - pages

collections:
  tabs:
    output: false
    sort_by: order
  assessments:
    output: true
    sort_by: date
  invoices:
    output: true
    sort_by: date

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      permalink: /emails/:title/
      comments: false
  - scope:
      path: "pages"
    values:
      comments: false
  - scope:
      path: ""
      type: "assessments"
    values:
      layout: assessment
      permalink: /assessments/:name/
      comments: false
  - scope:
      path: ""
      type: "invoices"
    values:
      layout: invoice
      permalink: /invoices/:name/
      comments: false

# Navigation — used by sidebar override and cat-jump links
nav:
  - title: "Summary"
    url: "/"
  - title: "Timeline"
    url: "/timeline/"
    icon: "fas fa-clock"
