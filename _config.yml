# GitHub Pages / build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude build/source files from the site output
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Tell Jekyll to process the pages folder
include:
  - pages

# Force posts to /emails/:title/ regardless of category
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /emails/:title/

# Navigation order
nav:
  - title: "Summary"
    url: "/"
  - title: "Timeline"
    url: "/timeline/"
  - title: "Issue Register"
    url: "/issues/"
  - title: "Document Integrity"
    url: "/document-integrity/"
  - title: "DST Analysis"
    url: "/dst/"
  - title: "Key Parties"
    url: "/parties/"
  - title: "Evidence"
    url: "/evidence/"
  - title: "Emails"
    url: "/emails/"
  - title: "Clinical"
    url: "/clinical/"